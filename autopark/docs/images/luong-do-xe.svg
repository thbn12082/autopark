<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1000" height="420" viewBox="0 0 1000 420"><title id="title">Một thao tác gần</title><desc id="desc">Người lái chọn tư thế đích gần; hệ thống tính và kiểm, xem trước, thực hiện rồi dừng. Người lái quyết định bước tiếp.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#51718c"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17324d}.t{font-size:24px;font-weight:700}.n{font-size:18px}.s{font-size:15px;fill:#526b80}.box{fill:#eaf3fc;stroke:#5383ae;stroke-width:1.5}.go{fill:#e9f5ed;stroke:#508765;stroke-width:1.5}.stop{fill:#fff1e6;stroke:#b37c46;stroke-width:1.5}.line{fill:none;stroke:#51718c;stroke-width:2;marker-end:url(#arrow)}</style><text x="40" y="44" class="t">Một thao tác gần</text><rect class="box" x="40" y="90" width="270" height="85" rx="12"/><text class="n" text-anchor="middle" x="175" y="122">1. Người lái chọn</text><text class="n" text-anchor="middle" x="175" y="147">tư thế đích gần</text><rect class="box" x="365" y="90" width="270" height="85" rx="12"/><text class="n" text-anchor="middle" x="500" y="122">2. Tính thao tác</text><text class="n" text-anchor="middle" x="500" y="147">Kiểm giới hạn và thử bám</text><rect class="box" x="690" y="90" width="270" height="85" rx="12"/><text class="n" text-anchor="middle" x="825" y="122">3. Xem trước</text><text class="n" text-anchor="middle" x="825" y="147">Người lái nhấn Thực hiện</text><rect class="go" x="690" y="250" width="270" height="85" rx="12"/><text class="n" text-anchor="middle" x="825" y="282">4. Tiến / lùi / đánh lái</text><text class="n" text-anchor="middle" x="825" y="307">Theo dõi phản hồi</text><rect class="stop" x="365" y="250" width="270" height="85" rx="12"/><text class="n" text-anchor="middle" x="500" y="282">5. Phanh và đứng yên</text><text class="n" text-anchor="middle" x="500" y="307">Đến đích hoặc cần dừng</text><rect class="box" x="40" y="250" width="270" height="85" rx="12"/><text class="n" text-anchor="middle" x="175" y="282">6. Chọn đích tiếp</text><text class="n" text-anchor="middle" x="175" y="307">Từ tư thế vừa dừng</text><path class="line" d="M310 132H365"/><path class="line" d="M635 132H690"/><path class="line" d="M825 175V250"/><path class="line" d="M690 292H635"/><path class="line" d="M365 292H310"/><path class="line" d="M175 250V175"/><text x="40" y="384" class="s">Không đủ điều kiện hoặc không có đường đạt: xe giữ dừng, người lái đánh giá và chọn lại đích.</text></svg>
