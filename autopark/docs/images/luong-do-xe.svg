<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100">
<title>Một đích gần · một lượt thao tác</title><desc>Người lái chọn tư thế đích; phần mềm tìm đường, kiểm bám, thực hiện rồi dừng.</desc>
<defs>
<marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#126ba3"/></marker>
<marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#087c65"/></marker>
<marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b13f4d"/></marker>
<marker id="muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#536d80"/></marker>
<marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#ad6711"/></marker>
<marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7652aa"/></marker>
</defs>
<rect width="1440" height="1100" fill="#f4f8fb"/>
<g font-family="Segoe UI">
<text x="44.00" y="56.00" font-size="32" fill="#173247" font-weight="600" text-anchor="start">Một đích gần · một lượt thao tác</text>
<text x="44.00" y="91.00" font-size="19" fill="#536d80" font-weight="400" text-anchor="start">Người lái chọn tư thế đích; phần mềm tìm đường, kiểm bám, thực hiện rồi dừng.</text>
<text x="44.00" y="142.00" font-size="18" fill="#536d80" font-weight="600" text-anchor="start">01   CHỌN &amp; TÍNH</text>
<text x="519.00" y="142.00" font-size="18" fill="#536d80" font-weight="600" text-anchor="start">02   SẴN SÀNG</text>
<text x="994.00" y="142.00" font-size="18" fill="#536d80" font-weight="600" text-anchor="start">03   THỰC HIỆN &amp; DỪNG</text>
<rect x="44" y="166" width="400" height="116" rx="15" fill="white" stroke="#126ba3" stroke-width="1.8"/>
<text x="64.00" y="200.00" font-size="22" fill="#126ba3" font-weight="600" text-anchor="start">Chọn vị trí + hướng đích</text>
<text x="64.00" y="231.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Xe đã ở chỗ khó; lấy tư thế hiện tại.</text>
<text x="64.00" y="259.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Sửa đích/vật cản → cần đường mới.</text>
<path d="M244.00,282.00 L244.00,320.00" fill="none" stroke="#126ba3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#blue)"/>
<rect x="44" y="320" width="400" height="144" rx="15" fill="white" stroke="#126ba3" stroke-width="1.8"/>
<text x="64.00" y="354.00" font-size="22" fill="#126ba3" font-weight="600" text-anchor="start">Tính thao tác</text>
<text x="64.00" y="385.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Kiểm đầu bài và vùng thao tác.</text>
<text x="64.00" y="413.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Tìm đường tiến/lùi; kiểm vùng quét.</text>
<text x="64.00" y="441.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Chạy thử bộ bám trong mô phỏng.</text>
<path d="M444.00,392.00 L519.00,392.00" fill="none" stroke="#126ba3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#blue)"/>
<text x="481.00" y="378.00" font-size="17" fill="#087c65" font-weight="400" text-anchor="middle">Đạt</text>
<rect x="519" y="320" width="400" height="116" rx="15" fill="#edf8f3" stroke="#087c65" stroke-width="1.8"/>
<text x="539.00" y="354.00" font-size="22" fill="#087c65" font-weight="600" text-anchor="start">Sẵn sàng · đường được nhận</text>
<text x="539.00" y="385.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Đường còn khớp cảnh và tư thế.</text>
<text x="539.00" y="413.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Chưa có lệnh chạy xe.</text>
<path d="M244.00,464.00 L244.00,510.00" fill="none" stroke="#b13f4d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#red)"/>
<text x="258.00" y="491.00" font-size="17" fill="#b13f4d" font-weight="400" text-anchor="start">Không đạt</text>
<rect x="44" y="510" width="400" height="116" rx="15" fill="#fff3f3" stroke="#b13f4d" stroke-width="1.8"/>
<text x="64.00" y="544.00" font-size="22" fill="#b13f4d" font-weight="600" text-anchor="start">Giữ xe đứng yên</text>
<text x="64.00" y="575.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Báo lý do; sửa đích/đầu bài</text>
<text x="64.00" y="603.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">rồi người dùng bấm tính lại.</text>
<path d="M44.00,568.00 L26.00,568.00 L26.00,224.00 L44.00,224.00" fill="none" stroke="#b13f4d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#red)"/>
<path d="M719.00,436.00 L719.00,510.00" fill="none" stroke="#087c65" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#green)"/>
<text x="733.00" y="476.00" font-size="17" fill="#536d80" font-weight="400" text-anchor="start">Tùy chọn</text>
<rect x="519" y="510" width="400" height="116" rx="15" fill="white" stroke="#087c65" stroke-width="1.8"/>
<text x="539.00" y="544.00" font-size="22" fill="#087c65" font-weight="600" text-anchor="start">Xem trước</text>
<text x="539.00" y="575.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Phát mô phỏng đường đã nhận.</text>
<text x="539.00" y="603.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Đóng xem trước → trở lại sẵn sàng.</text>
<path d="M919.00,568.00 L944.00,568.00 L944.00,378.00 L919.00,378.00" fill="none" stroke="#087c65" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#green)"/>
<path d="M919.00,350.00 L966.00,350.00 L966.00,224.00 L994.00,224.00" fill="none" stroke="#126ba3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#blue)"/>
<text x="962.00" y="303.00" font-size="17" fill="#126ba3" font-weight="400" text-anchor="middle">Bấm</text>
<rect x="994" y="166" width="400" height="116" rx="15" fill="white" stroke="#126ba3" stroke-width="1.8"/>
<text x="1014.00" y="200.00" font-size="22" fill="#126ba3" font-weight="600" text-anchor="start">Thực hiện</text>
<text x="1014.00" y="231.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Kiểm lại đường trước khi cho xe chạy.</text>
<text x="1014.00" y="259.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Kiểm tư thế, đứng yên và kết nối.</text>
<path d="M1194.00,282.00 L1194.00,320.00" fill="none" stroke="#126ba3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#blue)"/>
<rect x="994" y="320" width="400" height="144" rx="15" fill="white" stroke="#126ba3" stroke-width="1.8"/>
<text x="1014.00" y="354.00" font-size="22" fill="#126ba3" font-weight="600" text-anchor="start">Đang thực hiện tiến/lùi</text>
<text x="1014.00" y="385.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Đánh lái theo phản hồi.</text>
<text x="1014.00" y="413.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Đổi chiều chỉ sau khi đứng yên.</text>
<text x="1014.00" y="441.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Giám sát dữ liệu, vật cản, giới hạn.</text>
<path d="M1194.00,464.00 L1194.00,510.00" fill="none" stroke="#b13f4d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#red)"/>
<text x="1208.00" y="490.00" font-size="17" fill="#b13f4d" font-weight="400" text-anchor="start">Yêu cầu dừng / lỗi</text>
<rect x="994" y="510" width="400" height="116" rx="15" fill="#fff3f3" stroke="#b13f4d" stroke-width="1.8"/>
<text x="1014.00" y="544.00" font-size="22" fill="#b13f4d" font-weight="600" text-anchor="start">Đang dừng</text>
<text x="1014.00" y="575.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Yêu cầu dừng; tốc độ mục tiêu về 0.</text>
<text x="1014.00" y="603.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Chờ bằng chứng dừng; còn quãng phanh.</text>
<path d="M1394.00,392.00 L1416.00,392.00 L1416.00,720.00 L1194.00,720.00 L1194.00,758.00" fill="none" stroke="#087c65" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#green)"/>
<text x="1178.00" y="703.00" font-size="17" fill="#087c65" font-weight="400" text-anchor="middle">Tới đích trong dung sai + đứng yên</text>
<path d="M1194.00,626.00 L1194.00,670.00 L966.00,670.00 L966.00,812.00 L994.00,812.00" fill="none" stroke="#b13f4d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#red)"/>
<text x="978.00" y="746.00" font-size="17" fill="#b13f4d" font-weight="400" text-anchor="start">Đã đứng yên</text>
<rect x="994" y="758" width="400" height="116" rx="15" fill="#edf8f3" stroke="#087c65" stroke-width="1.8"/>
<text x="1014.00" y="792.00" font-size="22" fill="#087c65" font-weight="600" text-anchor="start">Lượt kết thúc · đã đứng yên</text>
<text x="1014.00" y="823.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Hoàn thành: tới đích đạt dung sai.</text>
<text x="1014.00" y="851.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Hoặc dừng theo yêu cầu.</text>
<path d="M994.00,816.00 L919.00,816.00" fill="none" stroke="#087c65" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#green)"/>
<rect x="519" y="758" width="400" height="116" rx="15" fill="white" stroke="#087c65" stroke-width="1.8"/>
<text x="539.00" y="792.00" font-size="22" fill="#087c65" font-weight="600" text-anchor="start">Chọn đích tiếp</text>
<text x="539.00" y="823.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Người lái đánh giá, giữ tư thế vừa dừng.</text>
<text x="539.00" y="851.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Đặt đích mới và tính một lượt mới.</text>
<path d="M519.00,816.00 L244.00,816.00 L244.00,684.00 L10.00,684.00 L10.00,224.00 L44.00,224.00" fill="none" stroke="#087c65" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#green)"/>
<rect x="44" y="936" width="1350" height="112" rx="15" fill="#fff8ec" stroke="#ad6711" stroke-width="1.8"/>
<text x="64.00" y="970.00" font-size="22" fill="#ad6711" font-weight="600" text-anchor="start">Các nhánh từ chối không tự chạy lại</text>
<text x="64.00" y="1001.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Chưa đủ điều kiện chạy → chờ. Không xác nhận dừng hoặc có sự cố → báo lỗi; xử lý và kiểm lại điều kiện.</text>
<text x="64.00" y="1029.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Dữ liệu phục hồi, kết nối lại hoặc xem trước xong đều không tự kích hoạt Thực hiện.</text>
</g></svg>