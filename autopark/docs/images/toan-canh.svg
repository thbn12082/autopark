<rect x="776" y="383" width="290" height="116" rx="15" fill="white" stroke="#126ba3" stroke-width="1.8"/>
<text x="796.00" y="417.00" font-size="22" fill="#126ba3" font-weight="600" text-anchor="start">Bộ bám đường</text>
<text x="796.00" y="448.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Tốc độ + góc lái mục tiêu.</text>
<text x="796.00" y="476.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Dừng trước khi đổi chiều.</text>
<path d="M921.00,329.00 L921.00,383.00" fill="none" stroke="#126ba3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#blue)"/>
<text x="934.00" y="360.00" font-size="17" fill="#536d80" font-weight="400" text-anchor="start">Sau START hợp lệ</text>
<path d="M342.00,372.00 L364.00,372.00 L364.00,480.00 L757.00,480.00 L757.00,443.00 L776.00,443.00" fill="none" stroke="#087c65" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#green)"/>
<text x="420.00" y="502.00" font-size="17" fill="#087c65" font-weight="400" text-anchor="start">Phản hồi tư thế / chuyển động</text>
<rect x="1124" y="185" width="264" height="314" rx="15" fill="#fff3f3" stroke="#b13f4d" stroke-width="1.8"/>
<text x="1144.00" y="219.00" font-size="22" fill="#b13f4d" font-weight="600" text-anchor="start">Session / giám sát</text>
<text x="1144.00" y="250.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Kiểm lại trước ARM.</text>
<text x="1144.00" y="278.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Tuổi / lỗi dữ liệu.</text>
<text x="1144.00" y="306.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Va chạm, phạm vi.</text>
<text x="1144.00" y="334.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Dự phòng quãng phanh</text>
<text x="1144.00" y="362.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">và góc thân xe quét.</text>
<text x="1144.00" y="390.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Yêu cầu STOP ngay.</text>
<text x="1144.00" y="418.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Lưu log / quyết định.</text>
