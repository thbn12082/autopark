<rect x="776" y="558" width="612" height="116" rx="15" fill="#edf8f3" stroke="#087c65" stroke-width="1.8"/>
<text x="796.00" y="592.00" font-size="22" fill="#087c65" font-weight="600" text-anchor="start">Đầu ra có kiểm soát</text>
<text x="796.00" y="623.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">SIM: mô hình xe. VehicleIO: lệnh có hạn qua liên kết.</text>
<text x="796.00" y="651.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Phản hồi quay lại bộ bám; sự cố chuyển sang nhánh dừng.</text>
