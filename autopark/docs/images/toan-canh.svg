<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050">
<title>Từ bằng chứng cảm biến tới lệnh chuyển động</title><desc>Sơ đồ chức năng của phần mềm. AI bổ sung vật cản; bộ bám đường mới tạo tốc độ và góc lái.</desc>
