<rect x="414" y="346" width="290" height="116" rx="15" fill="white" stroke="#126ba3" stroke-width="1.8"/>
<text x="434.00" y="380.00" font-size="22" fill="#126ba3" font-weight="600" text-anchor="start">Bản đồ / hợp nhất</text>
<text x="434.00" y="411.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Vật LiDAR + AI + người dùng.</text>
<text x="434.00" y="439.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">FREE camera không xóa vật.</text>
<path d="M342.00,404.00 L414.00,404.00" fill="none" stroke="#126ba3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#blue)"/>
