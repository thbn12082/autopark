<text x="360.00" y="673.00" font-size="17" fill="#087c65" font-weight="400" text-anchor="start">Phản hồi / đo mô phỏng hoặc thiết bị</text>
<path d="M980.00,674.00 L980.00,736.00 L264.00,736.00 L264.00,770.00" fill="none" stroke="#087c65" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#green)"/>
<path d="M1082.00,674.00 L1082.00,745.00 L719.00,745.00 L719.00,770.00" fill="none" stroke="#087c65" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#green)"/>
