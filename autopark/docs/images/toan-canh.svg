<rect width="1440" height="1050" fill="#f4f8fb"/>
<g font-family="Segoe UI">
<text x="44.00" y="56.00" font-size="32" fill="#173247" font-weight="600" text-anchor="start">Từ bằng chứng cảm biến tới lệnh chuyển động</text>
<text x="44.00" y="91.00" font-size="19" fill="#536d80" font-weight="400" text-anchor="start">Sơ đồ chức năng của phần mềm. AI bổ sung vật cản; bộ bám đường mới tạo tốc độ và góc lái.</text>
<rect x="32" y="126" width="1376" height="580" rx="20" fill="#ffffff" stroke="#c5d7e3" stroke-width="1.8"/>
<text x="52.00" y="158.00" font-size="17" fill="#536d80" font-weight="600" text-anchor="start">TRÊN MÁY TÍNH</text>
<rect x="52" y="185" width="290" height="116" rx="15" fill="white" stroke="#126ba3" stroke-width="1.8"/>
<text x="72.00" y="219.00" font-size="22" fill="#126ba3" font-weight="600" text-anchor="start">Nguồn cảm biến</text>
<text x="72.00" y="250.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">LiDAR / camera / telemetry.</text>
<text x="72.00" y="278.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Có timestamp và cờ hợp lệ.</text>
<rect x="52" y="346" width="290" height="116" rx="15" fill="white" stroke="#126ba3" stroke-width="1.8"/>
<text x="72.00" y="380.00" font-size="22" fill="#126ba3" font-weight="600" text-anchor="start">Timestamp &amp; tư thế</text>
<text x="72.00" y="411.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Neo hệ; kiểm tuổi dữ liệu.</text>
<text x="72.00" y="439.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Khớp map; kiểm odometry.</text>
<path d="M197.00,301.00 L197.00,346.00" fill="none" stroke="#126ba3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#blue)"/>
<rect x="52" y="507" width="290" height="144" rx="15" fill="#f5f0fa" stroke="#7652aa" stroke-width="1.8"/>
<text x="72.00" y="541.00" font-size="22" fill="#7652aa" font-weight="600" text-anchor="start">Camera → AI → BEV</text>
<text x="72.00" y="572.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Chiếu từ ảnh xuống sàn.</text>
<text x="72.00" y="600.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Trống / vật / chưa rõ.</text>
<text x="72.00" y="628.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Không phát lệnh lái.</text>
