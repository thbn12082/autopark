<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1000" height="540" viewBox="0 0 1000 540"><title id="title">Các khối của thao tác gần</title><desc id="desc">Tư thế đích do người lái chọn và dữ liệu cảm biến đưa vào lập đường; bộ bám nối mô phỏng hoặc VehicleIO, giám sát có quyền dừng.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#51718c"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#17324d}.t{font-size:24px;font-weight:700}.n{font-size:18px}.s{font-size:15px;fill:#526b80}.box{fill:#eaf3fc;stroke:#5383ae;stroke-width:1.5}.go{fill:#e9f5ed;stroke:#508765;stroke-width:1.5}.stop{fill:#fff1e6;stroke:#b37c46;stroke-width:1.5}.line{fill:none;stroke:#51718c;stroke-width:2;marker-end:url(#arrow)}</style><text x="40" y="44" class="t">Các khối của thao tác gần</text><rect class="box" x="40" y="90" width="260" height="85" rx="12"/><text class="n" text-anchor="middle" x="170" y="122">Người lái</text><text class="n" text-anchor="middle" x="170" y="147">Chọn tư thế đích gần</text><rect class="box" x="370" y="90" width="260" height="85" rx="12"/><text class="n" text-anchor="middle" x="500" y="122">LiDAR + camera</text><text class="n" text-anchor="middle" x="500" y="147">Vật cản và độ mới</text><rect class="box" x="700" y="90" width="260" height="85" rx="12"/><text class="n" text-anchor="middle" x="830" y="122">Định vị cục bộ</text><text class="n" text-anchor="middle" x="830" y="147">Tư thế và độ tin cậy</text><rect class="box" x="200" y="235" width="600" height="85" rx="12"/><text class="n" text-anchor="middle" x="500" y="267">Lập một thao tác</text><text class="n" text-anchor="middle" x="500" y="292">Giới hạn · toàn thân / vùng quét · thử bám</text><rect class="go" x="200" y="395" width="270" height="85" rx="12"/><text class="n" text-anchor="middle" x="335" y="427">Bộ bám đường</text><text class="n" text-anchor="middle" x="335" y="452">Tốc độ và góc lái</text><rect class="go" x="530" y="395" width="270" height="85" rx="12"/><text class="n" text-anchor="middle" x="665" y="427">Mô phỏng / VehicleIO</text><text class="n" text-anchor="middle" x="665" y="452">Phản hồi và đứng yên</text><path class="line" d="M170 175V205H350V235"/><path class="line" d="M500 175V235"/><path class="line" d="M830 175V205H650V235"/><path class="line" d="M335 320V395"/><path class="line" d="M470 437H530"/><path class="line" d="M800 437H910V212H830V175"/><text x="552" y="355" class="s">Giám sát có quyền yêu cầu dừng</text><text x="552" y="378" class="s">và hủy đường mất hiệu lực.</text><text x="40" y="518" class="s">Thiết kế gồm phần đã thử mô phỏng / bàn thử; chưa xác nhận trên xe thật.</text></svg>
