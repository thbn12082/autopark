<rect x="44" y="770" width="420" height="162" rx="15" fill="#edf8f3" stroke="#087c65" stroke-width="1.8"/>
<text x="64.00" y="804.00" font-size="22" fill="#087c65" font-weight="600" text-anchor="start">SIM</text>
<text x="64.00" y="835.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Mô hình động học + phản hồi giả.</text>
<text x="64.00" y="863.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Ảnh hai cảnh trong docs dùng nhánh này.</text>
<text x="64.00" y="891.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Không mở cổng thiết bị.</text>
<rect x="509" y="770" width="420" height="162" rx="15" fill="white" stroke="#126ba3" stroke-width="1.8"/>
<text x="529.00" y="804.00" font-size="22" fill="#126ba3" font-weight="600" text-anchor="start">Bo ảo / QEMU</text>
<text x="529.00" y="835.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Kiểm giao thức và máy trạng thái.</text>
<text x="529.00" y="863.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Xe phía laptop vẫn là mô phỏng.</text>
<text x="529.00" y="891.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Không phải phép đo cơ cấu thật.</text>
<rect x="974" y="770" width="420" height="162" rx="15" fill="#fff8ec" stroke="#ad6711" stroke-width="1.8"/>
<text x="994.00" y="804.00" font-size="22" fill="#ad6711" font-weight="600" text-anchor="start">Bo + xe thật · còn bị chặn</text>
<text x="994.00" y="835.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Chưa có nguồn tư thế sống được nhận.</text>
<text x="994.00" y="863.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Chưa đủ telemetry / đo xe / hiệu chuẩn.</text>
<text x="994.00" y="891.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Chưa chạy thao tác trên xe thật.</text>
<text x="44.00" y="990.00" font-size="18" fill="#536d80" font-weight="400" text-anchor="start">Mũi tên xanh: dữ liệu / điều khiển / phản hồi. Đỏ: giám sát dừng. Nét đứt: vòng phản hồi hoặc nhánh chưa đủ điều kiện.</text>
