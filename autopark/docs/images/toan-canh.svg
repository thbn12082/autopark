<rect x="414" y="185" width="290" height="116" rx="15" fill="white" stroke="#126ba3" stroke-width="1.8"/>
<text x="434.00" y="219.00" font-size="22" fill="#126ba3" font-weight="600" text-anchor="start">Người lái chọn đích gần</text>
<text x="434.00" y="250.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Vị trí + hướng; cấu hình xe.</text>
<text x="434.00" y="278.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Giới hạn cho một lượt.</text>
<rect x="776" y="185" width="290" height="144" rx="15" fill="white" stroke="#126ba3" stroke-width="1.8"/>
<text x="796.00" y="219.00" font-size="22" fill="#126ba3" font-weight="600" text-anchor="start">Planner + rollout</text>
<text x="796.00" y="250.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Đường tiến/lùi + vùng quét.</text>
<text x="796.00" y="278.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Kiểm giới hạn; thử bám.</text>
<text x="796.00" y="306.00" font-size="19" fill="#173247" font-weight="400" text-anchor="start">Đạt → READY; chờ chạy.</text>
<path d="M704.00,243.00 L776.00,243.00" fill="none" stroke="#126ba3" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#blue)"/>
