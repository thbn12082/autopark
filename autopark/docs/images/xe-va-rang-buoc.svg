<title id="title">Thân xe và vùng quét khi quay</title>
<desc id="desc">Tư thế xe đặt tại tâm trục sau. Xe quay theo cung vì góc lái có giới hạn. Vùng quét đầu và đuôi lớn hơn đường đi của điểm tham chiếu; vì thế phải kiểm cả thân xe với vật cản.</desc>
