[env]
platform = espressif32 @ 7.1.3
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -Wl,--wrap=esp_panic_handler
extra_scripts = post:merge_images.py

[env:probe_qio]

[env:probe_dio]
board_build.flash_mode = dio

; 87 = 'W' (hang loop -> task watchdog), 82 = 'R' (esp_restart), 3 s after the first power-on boot
[env:probe_autoW]
build_flags = ${env.build_flags} -DPROBE_AUTO_CMD=87 -DPROBE_AUTO_MS=3000

[env:probe_autoR]
build_flags = ${env.build_flags} -DPROBE_AUTO_CMD=82 -DPROBE_AUTO_MS=3000

[env:probe_autoA]
build_flags = ${env.build_flags} -DPROBE_AUTO_CMD=65 -DPROBE_AUTO_MS=3000
