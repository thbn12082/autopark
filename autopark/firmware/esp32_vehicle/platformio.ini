; Firmware ESP32-S3 cho xe mô hình tự đỗ (kế hoạch mục 9). CHƯA BIÊN DỊCH, CHƯA NẠP: máy phát triển hiện tại không
; có PlatformIO hay trình biên dịch. Xem README.md trước khi nạp.
;
; CHƯA CHỐT theo bo thực: loại bo (board), cổng USB dùng cho Serial, chân ESC/servo/E-stop (src/main.cpp).

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1          ; CHƯA CHỐT: đổi theo bo ESP32-S3 thực nhận được
framework = arduino
monitor_speed = 115200
; Arduino-ESP32 2.x mặc định biên dịch C++11; lõi dùng C++17.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DARDUINO_USB_CDC_ON_BOOT=1       ; Serial = cổng USB gốc (USB CDC) của ESP32-S3
    -DAP_ENABLE_PWM_OUTPUTS=0         ; 0 = KHÔNG điều khiển chân nào; chỉ bật sau khi chốt sơ đồ chân
    ; Arduino-ESP32 2.x (nền tảng espressif32 chính thức): móc panic kéo chân ESC xuống thấp (__wrap_esp_panic_handler
    ; trong src/main.cpp). Chuyển sang 3.x/pioarduino thì main.cpp tự dùng set_arduino_panic_handler; khi đó lõi Arduino
    ; đã tự bọc esp_panic_handler, nên XÓA dòng dưới để khỏi phụ thuộc vào việc cờ trùng được bỏ qua. CHƯA BIÊN DỊCH.
    -Wl,--wrap=esp_panic_handler
; test/host là test C++ thuần chạy trên máy tính (xem README), không phải test Unity của PlatformIO.
test_ignore = host
