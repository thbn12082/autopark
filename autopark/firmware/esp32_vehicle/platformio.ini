; Firmware ESP32-S3 cho xe mô hình tự đỗ (kế hoạch mục 9). ĐÃ BIÊN DỊCH (29/09/2026, `pio run -e esp32s3`, 0 cảnh báo),
; CHƯA NẠP, CHƯA CHẠY trên bo nào. Xem README.md trước khi nạp.
;
; CHƯA CHỐT theo bo thực: loại bo (board), cổng USB dùng cho Serial, chân ESC/servo/E-stop (src/main.cpp).

[platformio]
default_envs = esp32s3

[env:esp32s3]
; Khóa phiên bản (29/09/2026): espressif32 7.1.3 = Arduino-ESP32 2.0.17 (gói 4.20017), GCC Xtensa 8.4.0. Không ghi
; phiên bản thì máy khác tải bản mới nhất và có thể build ra khác.
platform = espressif32 @ 7.1.3
board = esp32-s3-devkitc-1          ; CHƯA CHỐT: đổi theo bo ESP32-S3 thực nhận được
framework = arduino
monitor_speed = 115200
; Arduino-ESP32 2.x mặc định biên dịch C++11; lõi dùng C++17.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DARDUINO_USB_CDC_ON_BOOT=1       ; Serial = cổng USB gốc (USB CDC) của ESP32-S3
    -DAP_ENABLE_PWM_OUTPUTS=0         ; 0 = KHÔNG điều khiển chân nào; chỉ bật sau khi chốt sơ đồ chân
    ; Móc panic kéo chân ESC xuống thấp. Arduino-ESP32 2.x: __wrap_esp_panic_handler trong src/main.cpp. Chuyển sang
    ; 3.x/pioarduino: main.cpp tự dùng set_arduino_panic_handler, và lõi 3.x tự định nghĩa __wrap_esp_panic_handler,
    ; nhưng VẪN PHẢI GIỮ dòng dưới: Arduino IDE thêm cờ này, PlatformIO/pioarduino (55.3.312) thì không, và không có nó
    ; thì móc 3.x không bao giờ được gọi (kiểm bằng objdump 29/09/2026, README mục "Biên dịch cho ESP32-S3").
    -Wl,--wrap=esp_panic_handler
; test/host là test C++ thuần chạy trên máy tính (xem README), không phải test Unity của PlatformIO.
test_ignore = host

[env:esp32s3_qemu]
; Bản CHỈ ĐỂ CHẠY TRONG QEMU (bo ảo trên máy tính), KHÔNG nạp vào xe (thêm 30/09/2026, docs/MO_PHONG_FIRMWARE.md).
; Mã nguồn y hệt env esp32s3; chỉ khác:
; - Serial qua UART0 (ARDUINO_USB_CDC_ON_BOOT=0): QEMU của Espressif (9.2.2) chỉ có vỏ thanh ghi USB-Serial-JTAG, không
;   nối ra máy tính, nên bản USB CDC chạy được nhưng laptop không nói chuyện được với nó.
; - Flash DIO: với QIO, QEMU 9.2.2 đọc sai flash lúc chạy (lệch 2 byte, espressif/qemu#169) và ảnh 8 MB không khởi động.
; - qemu/tao_anh_flash.py ghép bootloader + bảng phân vùng + boot_app0 + app thành .pio/build/esp32s3_qemu/qemu_flash.bin.
extends = env:esp32s3
board_build.flash_mode = dio
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DARDUINO_USB_CDC_ON_BOOT=0       ; Serial = UART0 (QEMU nối UART0 ra cổng TCP)
    -DAP_ENABLE_PWM_OUTPUTS=0         ; QEMU của Espressif không có LEDC: bật PWM thì ledcSetup panic
    -Wl,--wrap=esp_panic_handler
extra_scripts = post:qemu/tao_anh_flash.py
