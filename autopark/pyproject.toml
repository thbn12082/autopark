[project]
name = "autopark"
version = "0.1.0"
description = "Xe mô hình tự đỗ: mô phỏng, lập đường, bám đường, bàn thử LiDAR/camera/AI, VehicleIO và firmware ESP32-S3 (chưa chạy trên xe thật)"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.26",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "coverage>=7"]
video = ["opencv-python>=4.10", "pygrabber>=0.2; sys_platform == 'win32'"]
perception = ["opencv-python>=4.10", "torch>=2.4", "torchvision>=0.19", "pillow>=10"]
datasets = ["opencv-python>=4.10", "gdown>=6.4", "requests>=2.32"]
lidar = ["opencv-python>=4.10", "pyserial>=3.5"]
rig = ["opencv-python>=4.10", "pyserial>=3.5", "PySide6>=6.7", "torch>=2.4", "torchvision>=0.19", "psutil>=5.9", "nvidia-ml-py>=12", "pygrabber>=0.2; sys_platform == 'win32'"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autopark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["planner_budget: checks search results under wall-clock budgets; run without coverage tracing"]
# Chỉ giữ thư mục tmp_path của test hỏng (30/09/2026): giữ hết thì mỗi lượt .venv-train để lại ≈ 2,1 GB trong %TEMP%,
# mà ổ C của máy bàn chật (docs/CHUYEN_MAY_BAN.md mục 8).
tmp_path_retention_policy = "failed"
